name: Tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: ./.github/actions/lfs-cache
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
      - uses: ./.github/actions/setup-godot
      - name: Run the test gate
        run: |
          mkdir -p "$RUNNER_TEMP/frogger"
          TMPDIR="$RUNNER_TEMP/frogger" tools/run_tests.sh
      - name: Retain the run logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/frogger/frogger-tests.*/*.log
          retention-days: 14
          if-no-files-found: ignore
